<!doctype html><html lang="vi"><head><meta charset=utf8><title>Sổ từ vựng TOEIC</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%233e7b3a%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2236%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3ET%3C/text%3E%3C/svg%3E"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: one centered study column; sticky green header with breadcrumb; views swap in place */
:root{
  --bg:#ffffff; --page:#fafcfa; --surface:#f1f8f0; --surface-2:#e2f1df; --line:#dfe9dd; --tabbar:#e9ecef;
  --fg:#1f2a1f; --muted:#6b7a6b; --accent:#3e7b3a; --accent-strong:#2f6a2c; --accent-soft:#e3f2e0; --on-accent:#ffffff;
  --card-a:#ffffff; --card-b:#f1f9ef; --card-line:#d2ebcf;
  --good:#2f7d32; --good-bg:#e5f4e3; --bad:#c0392b; --bad-bg:#fdecea; --blue:#3b6aa0; --blue-bg:#e6effa;
  --shadow:0 2px 6px rgba(62,123,58,.06),0 8px 24px rgba(62,123,58,.08);
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode",sans-serif;
  --r:14px;
}
:root,:root[data-theme="dark"]{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);color:var(--fg);border-bottom:1px solid var(--card-line);box-shadow:0 2px 10px rgba(62,123,58,.07)}
.top-in{max-width:880px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;background:none;border:0;color:var(--accent);padding:0;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#5a9a52,#3e7b3a);color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 6px rgba(62,123,58,.3)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:13px;opacity:.95;min-width:0}
.crumbs button{background:none;border:0;color:var(--muted);padding:2px 4px;border-radius:6px}
.crumbs button:hover{color:var(--accent);background:var(--accent-soft)}
.crumbs .cur{color:var(--accent)}
.crumbs span.sep{opacity:.6}
.crumbs .cur{padding:2px 4px;font-weight:600}

main{max-width:880px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(24px,5vw,32px);line-height:1.2}
h2{font-size:19px}
h3{font-size:16px}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--bg);border:1px solid var(--line);box-shadow:0 1px 3px rgba(62,123,58,.04);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s,transform .15s}
button.card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.card.soon{background:var(--surface);color:var(--muted);cursor:default}
.card .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);width:fit-content}
.pill.grey{color:var(--blue);background:var(--blue-bg)}
.pill.grey{color:var(--muted);background:var(--surface)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.hero{background:var(--bg);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;background:var(--tabbar);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.mode{min-height:112px}
.mode .tag{font-size:12px;color:var(--muted)}
.mode h3{display:flex;align-items:center;gap:8px}
.mode .ico{width:28px;height:28px;border-radius:8px;background:var(--surface-2);color:var(--accent-strong);display:grid;place-items:center;flex:none}
.mode .ico svg{width:16px;height:16px}

.vlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.vrow{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:start}
.vrow:first-child{border-top:0}
.vrow .en{font-weight:600;color:var(--accent-strong)}
.vrow .ipa{font-family:var(--f-ipa);color:var(--muted);font-size:13px;margin-left:6px}
.vrow .vi{color:var(--muted);font-size:14px}
.vrow.known .en::after{content:"đã thuộc";font-size:11px;font-weight:600;color:var(--accent-strong);background:var(--surface-2);padding:1px 6px;border-radius:99px;margin-left:8px;vertical-align:2px}
.spk{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--accent-strong);flex:none}
.spk:hover{background:var(--surface-2)}
.spk svg{width:16px;height:16px}

.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 2px 6px rgba(62,123,58,.25)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn:disabled{opacity:.5;cursor:default}

/* exercise */
.stage{display:flex;flex-direction:column;gap:16px;max-width:620px;width:100%;margin:0 auto}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .bar{flex:1}
.q{background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid var(--card-line);box-shadow:var(--shadow);border-radius:var(--r);padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.q .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.q .big{color:var(--accent);font-family:var(--f-display);font-size:clamp(20px,4.5vw,26px);font-weight:600;line-height:1.3;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{width:24px;height:24px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{color:var(--fg)}
.inp{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.inp.right{border-color:var(--good)} .inp.wrong{border-color:var(--bad)}
.hint{font-family:var(--f-ipa);letter-spacing:.06em;color:var(--muted);font-size:15px}

/* flashcard */
.fc{perspective:1200px;width:100%;height:260px;cursor:pointer;background:none;border:0;padding:0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--card-line);background:linear-gradient(180deg,var(--card-a),var(--card-b));box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--card-b),var(--surface-2))}
.face .w{color:var(--accent);font-family:var(--f-display);font-size:clamp(22px,5vw,30px);font-weight:600;line-height:1.25;text-wrap:balance}
.face .ipa{font-family:var(--f-ipa);color:var(--accent-strong);opacity:.85;font-size:16px;letter-spacing:.02em}
.face .tap{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.face .typ{position:absolute;top:12px;left:14px}

.uk{font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--accent-strong);background:var(--surface-2);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.face .sub-en{font-weight:600;font-size:17px;margin-top:4px}
.face .vi-sm{color:var(--muted);font-size:16px}
.face .st{position:absolute;top:12px;right:14px}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.judge{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.judge .btn{justify-content:center;padding:12px 16px}
.btn.miss{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.btn.miss:hover{border-color:var(--bad);filter:brightness(.97)}
.fc{height:280px}
.note{border:1px solid var(--card-line);background:var(--bg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.note-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.note-ic{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:12px;font-family:Georgia,serif;font-style:italic;text-transform:none}
.note-tip{margin:0;font-size:14px;line-height:1.6}
.ext{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.ext-i{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;font-size:13px}
.ext-i b{color:var(--accent-strong);font-weight:600}
.ext-i span{color:var(--muted);font-size:12.5px}
.ext-i:hover{border-color:var(--accent);background:var(--accent-soft)}
.vd{margin-top:6px}
.vd summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;width:fit-content}
.vd .note{margin-top:8px}
.pill.nw{background:#fff3d6;color:#9a6a00}
.nw-card{border-color:#f1dfae;background:linear-gradient(180deg,#ffffff,#fffaf0)}
.nw-card:hover{border-color:#e0b84f!important}
.note-ex{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:10px}
.spk.sm{width:30px;height:30px}
.spk.sm svg{width:14px;height:14px}
.ex-en{font-weight:500;font-size:14px}
.ex-vi{color:var(--muted);font-size:13px}
.tw{border:0;background:none;padding:0 1px;font:inherit;font-weight:600;color:var(--accent-strong);border-bottom:1.5px dotted var(--accent);border-radius:0;cursor:pointer}
.tw:hover{background:var(--accent-soft)}
.tvoc{display:flex;flex-wrap:wrap;gap:6px}
.tv{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;max-width:100%}
.tv:hover{border-color:var(--accent);background:var(--accent-soft)}
.tv-ic{width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent-strong);flex:none}
.tv-ic svg{width:12px;height:12px}
.tv b{color:var(--accent-strong);font-weight:600}
.tv-ipa{font-family:var(--f-ipa);color:var(--muted);font-size:12.5px}
.vpick{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.vpick select{font:inherit;font-size:12.5px;max-width:190px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.vpick .spk{width:30px;height:30px}
@media (max-width:560px){.vpick{margin-left:0;width:100%}.vpick select{flex:1;max-width:none}}
/* match */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.tile{min-height:76px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:14px;line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center;transition:all .15s}
.tile.en{font-weight:600}
.tile.sel{border-color:var(--accent);background:var(--surface-2)}
.tile.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.tile.done{opacity:0;pointer-events:none;transform:scale(.92)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* scramble */
.slots{min-height:56px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slots.right{border-color:var(--good);border-style:solid;background:var(--good-bg)}
.slots.wrong{border-color:var(--bad);border-style:solid;background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-weight:500}
.chip:hover{border-color:var(--accent)}

.score{font-family:var(--f-display);font-size:48px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.kbd{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* bộ học tự tạo */
.add-card{border:1.5px dashed var(--accent);background:var(--surface);align-items:flex-start}
button.add-card:hover{background:var(--accent-soft)}
.add-ic{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:24px;font-weight:500;line-height:1;box-shadow:0 2px 6px rgba(62,123,58,.25)}
.my-card{border-color:var(--card-line);background:linear-gradient(180deg,#ffffff,#f3faf1)}
.pill.my{background:var(--blue-bg);color:var(--blue)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;color:var(--fg);padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);width:100%;min-width:0}
.fld textarea{resize:vertical;font-size:14px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fgrid .wide{grid-column:1/-1}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:30px 16px;border:2px dashed var(--card-line);border-radius:var(--r);background:var(--surface);cursor:pointer;color:var(--muted);font-size:13px;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--accent-strong);font-size:16px;font-family:var(--f-display)}
.drop-ic{width:46px;height:46px;border-radius:14px;background:var(--bg);border:1px solid var(--card-line);display:grid;place-items:center;color:var(--accent)}
.drop-ic svg{width:24px;height:24px}
.help .note{margin-top:8px}
.fmt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--surface);padding:1px 5px;border-radius:5px}
.dmsg{border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.6}
.dmsg.ok{background:var(--good-bg);color:var(--good)}.dmsg.err{background:var(--bad-bg);color:var(--bad)}.dmsg.info{background:var(--blue-bg);color:var(--blue)}
.dmsg b{color:inherit}
.drows{display:flex;flex-direction:column;gap:8px}
.drow{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.drow.miss{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad-bg)}
.drow summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.drow summary::-webkit-details-marker{display:none}
.drow[open] summary{border-bottom:1px dashed var(--line);margin-bottom:10px}
.dnum{width:26px;height:26px;border-radius:8px;background:var(--surface-2);color:var(--accent-strong);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.dsum{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.dsum b{color:var(--accent-strong)}
.dsum .ipa{font-family:var(--f-ipa);color:var(--muted);font-size:13px}
.dpos,.vpos{font-size:11.5px;font-weight:600;color:var(--blue);background:var(--blue-bg);padding:1px 7px;border-radius:99px}
.vpos{margin-left:6px;vertical-align:1px}
.dvi{color:var(--fg);font-size:14px;flex-basis:100%}
.dhas{color:var(--muted);font-size:12px;flex-basis:100%}
.dwarn{color:var(--bad);font-style:normal;font-weight:600}
.dchev{color:var(--muted);font-size:20px;transition:transform .15s;flex:none}
.drow[open] .dchev{transform:rotate(90deg)}
.drow .fgrid,.drow-act{padding:0 12px 12px}
.pill.auto{background:#fff3d6;color:#9a6a00;flex:none}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.sm svg{width:14px;height:14px}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}

const VOC_RE=new RegExp("(?<![\\p{L}'-])("+Object.keys(VOC).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\p{L}'-])","giu");
function tipHTML(tip,head){
  const found=[];let out="",last=0;
  tip.replace(VOC_RE,(m,g,off)=>{
    out+=esc(tip.slice(last,off));
    out+=`<button class="tw" data-say="${esc(m)}" title="Nghe">${esc(m)}</button>`;
    last=off+m.length;
    const k=m.toLowerCase();
    if(k!==head.toLowerCase()&&!found.includes(k))found.push(k);
    return m;
  });
  out+=esc(tip.slice(last));
  return {html:out,found};
}
function noteHTML(it,open){

let VOICE=null,speakTimer=null,lastSay={t:"",at:0},curUtter=null;
function engVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){return []}}
function pickVoice(){
  try{
    const vs=engVoices();if(!vs.length)return;
    const want=store.voice&&vs.find(v=>v.name===store.voice);
    const gb=vs.filter(v=>/en[-_]GB/i.test(v.lang));
    VOICE=want||gb.find(v=>v.localService)||gb[0]||vs.find(v=>v.localService)||vs[0]||null;
    const sel=document.getElementById("voicesel");
    if(sel){
      const sorted=[...gb,...vs.filter(v=>!gb.includes(v))];
      sel.innerHTML='<option value="">Tự động</option>'+sorted.map(v=>`<option value="${esc(v.name)}"${store.voice===v.name?" selected":""}>${esc(v.name.replace(/^Microsoft |Google /,"").replace(/ Online \(Natural\)/," (Natural)"))} · ${esc(v.lang)}${v.localService?"":" · mạng"}</option>`).join("");
    }
  }catch(e){}
}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(text){
  try{
    if(!("speechSynthesis" in window)){toast("Trình duyệt này chưa hỗ trợ phát âm.");return}
    const t=String(text).replace(/\(.*?\)/g,"").trim();if(!t)return;
    const now=Date.now();
    if(t===lastSay.t&&now-lastSay.at<700)return;   /* chặn gọi trùng trong 0,7 giây */
    lastSay={t,at:now};
    clearTimeout(speakTimer);
    const ss=speechSynthesis;
    const busy=ss.speaking||ss.pending;
    if(busy)ss.cancel();
    if(!VOICE)pickVoice();
    speakTimer=setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(t);
      if(VOICE)u.voice=VOICE;
      u.lang=VOICE?VOICE.lang:"en-GB";u.rate=slow?0.6:0.92;
      curUtter=u;               /* giữ tham chiếu để trình duyệt không phát lại */
      ss.speak(u);
    },busy?150:20);
  }catch(e){toast("Không phát được âm thanh.")}
}
function stopSpeak(){try{clearTimeout(speakTimer);speechSynthesis.cancel()}catch(e){}}

function poolOf(topic,mode){
  let items=topic.items;
  const m=MODES.find(x=>x.id===mode);
  if(m&&m.phrasesOnly) return topic.custom?myScramblePool(topic):items.filter(i=>i.type==="p");
  if(store.filter==="w") items=items.filter(i=>i.type==="w");
  if(store.filter==="p") items=items.filter(i=>i.type==="p");

}

/* ===================== CÁC DẠNG BÀI ===================== */
function header(i,n,extra=""){
  return `<div class="progress"><span>${i+1}/${n}</span><div class="bar"><i style="width:${(i)/n*100}%"></i></div>${extra}</div>`;
}
function startMode(mode,customPool){
  const t=topicById(S.topic);
  let pool=customPool||poolOf(t,mode);
  if(!pool.length){app.innerHTML=`<div class="stage"><div class="q"><p>Phần này chưa có mục nào để ôn.</p><button class="btn" data-go="topic">Quay lại</button></div></div>`;return}
  if(mode==="flash")return flashStart(pool);
  if(mode==="match")return matchStart(pool);
  if(mode==="scramble")return scrStart(pool);
  const q=shuffle(pool).slice(0,Math.min(customPool?pool.length:12,pool.length));
  sess={mode,queue:q,i:0,correct:0,wrong:[],done:false};
  if(mode==="type"||mode==="dict")return inpRender();
  return mcqRender();
}

/* --- Trắc nghiệm --- */
function distractors(q,field){
  const t=topicById(S.topic);
  const seen=new Set([q[field]]);const out=[];
  const SEC=t.section==="nw"?NW_ITEMS:t.section==="my"?MY_ITEMS:ITEMS;const pools=[t.items.filter(x=>x.type===q.type),SEC.filter(x=>x.type===q.type),SEC,ITEMS];
  for(const p of pools){for(const x of shuffle(p)){if(out.length>=3)break;if(!seen.has(x[field])){seen.add(x[field]);out.push(x)}}}
  return out;
}
function mcqRender(){
  const q=sess.queue[sess.i];
  const field=sess.mode==="vi2en"?"en":"vi";
  if(!sess.opts) sess.opts=shuffle([q,...distractors(q,field)]);
  let prompt="";
  if(sess.mode==="vi2en") prompt=`<span class="label">Từ tiếng Anh nào có nghĩa</span><div class="big">${esc(q.vi)}</div>`;
  if(sess.mode==="en2vi") prompt=`<span class="label">Nghĩa của</span><div class="big">${esc(q.en)}</div>${q.ipa?`<span class="hint">${esc(q.ipa)}</span>`:""}<button class="spk" data-say="${esc(q.en)}" aria-label="Nghe">${SPK}</button>`;
  if(sess.mode==="listen") prompt=`<span class="label">Nghe và chọn nghĩa đúng</span><button class="btn primary" data-say="${esc(q.en)}">${SPK} Nghe lại</button>`;
  app.innerHTML=`<div class="stage">${header(sess.i,sess.queue.length,`<span>Đúng ${sess.correct}</span>`)}
  <div class="q">${prompt}</div>
  <div class="opts">${sess.opts.map((o,k)=>`<button class="opt" data-opt="${k}"><span class="k">${k+1}</span><span>${esc(o[field])}</span></button>`).join("")}</div>
  <div id="fb"></div><p class="kbd">Phím tắt: 1–4 để chọn, Enter để sang câu tiếp.</p></div>`;
  if(sess.mode==="listen") setTimeout(()=>speak(q.en),250);
}
function mcqAnswer(k){
  if(sess.answered)return;
  sess.answered=true;
  const q=sess.queue[sess.i];const pick=sess.opts[k];const ok=pick===q;
  if(ok)sess.correct++;else sess.wrong.push(q);
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(sess.opts[j]===q)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"Chính xác!":"Chưa đúng."} <b>${esc(q.en)}</b> = ${esc(q.vi)}
  <button class="spk" data-say="${esc(q.en)}" aria-label="Nghe">${SPK}</button><span style="flex:1"></span><button class="btn primary" data-act="next">Câu tiếp</button></div>${noteHTML(q)}`;
  if(sess.mode!=="listen") speak(q.en);
  $('[data-act="next"]').focus();
}
function next(){
  sess.i++;sess.answered=false;sess.opts=null;
  if(sess.i>=sess.queue.length)return result();
  (sess.mode==="type"||sess.mode==="dict")?inpRender():mcqRender();
}

/* --- Gõ từ / chính tả --- */
function hintOf(en){return en.split(" ").map(w=>w[0]+w.slice(1).replace(/[a-z]/gi,"_")).join("  ")}
function inpRender(){
  const q=sess.queue[sess.i];

    ?`<span class="label">Gõ tiếng Anh cho</span><div class="big">${esc(q.vi)}</div><span class="hint" id="hint" hidden>${esc(hintOf(q.en))}</span>`

  app.innerHTML=`<div class="stage">${header(sess.i,sess.queue.length,`<span>Đúng ${sess.correct}</span>`)}
  <div class="q">${prompt}</div>

  <div class="row"><button class="btn primary" data-act="check">Kiểm tra</button><button class="btn" data-act="hint">Gợi ý</button><button class="btn" data-act="skip">Bỏ qua</button></div>
  <div id="fb"></div></div>`;
  $("#ans").focus();
  if(sess.mode==="dict") setTimeout(()=>speak(q.en),250);
}
function inpCheck(skip){
  if(sess.answered){next();return}
  const q=sess.queue[sess.i];const v=$("#ans").value;
  if(!skip&&!v.trim()){$("#ans").focus();return}
  sess.answered=true;
  const ok=!skip&&isRight(q,v);
  if(ok)sess.correct++;else sess.wrong.push(q);
  $("#ans").classList.add(ok?"right":"wrong");$("#ans").readOnly=true;
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"Chính xác!":"Đáp án:"} <b>${esc(q.en)}</b> ${q.ipa?`<span class="hint">${esc(q.ipa)}</span>`:""} · ${esc(q.vi)}
  <button class="spk" data-say="${esc(q.en)}" aria-label="Nghe">${SPK}</button><span style="flex:1"></span><button class="btn primary" data-act="next">Câu tiếp</button></div>${noteHTML(q)}`;
  speak(q.en);
}

/* --- Kết quả --- */
function saveBest(mode,val,lowerBetter){
  const k=S.topic+"|"+mode;const old=store.best[k];
  if(old==null||(lowerBetter?val<old:val>old)){store.best[k]=val;save();return true}return false;
}
function result(){
  const n=sess.queue.length,pct=Math.round(sess.correct/n*100);
  const rec=saveBest(sess.mode,pct);
  const msg=pct===100?"Hoàn hảo! Bạn nắm rất chắc phần này.":pct>=80?"Rất tốt, chỉ còn vài mục cần ôn lại.":pct>=50?"Khá ổn. Ôn lại các câu sai rồi làm thêm một lượt nhé.":"Hãy xem lại Flashcard rồi quay lại làm bài.";
  app.innerHTML=`<div class="stage"><div class="q"><span class="label">Kết quả</span><div class="score">${pct}%</div>
  <p style="margin:0">${sess.correct}/${n} câu đúng${rec?" · <b style=\"color:var(--accent)\">Kỷ lục mới!</b>":""}</p><p class="muted" style="margin:0">${msg}</p>
  <div class="row" style="justify-content:center">${sess.wrong.length?`<button class="btn primary" data-act="retrywrong">Ôn lại ${sess.wrong.length} câu sai</button>`:""}
  <button class="btn ${sess.wrong.length?"":"primary"}" data-act="again">Làm lượt mới</button><button class="btn" data-go="topic">Chọn cách ôn khác</button></div></div>
  ${sess.wrong.length?`<h3>Cần ôn lại</h3><div class="vlist">${sess.wrong.map(i=>`<div class="vrow"><button class="spk" data-say="${esc(i.en)}" aria-label="Nghe">${SPK}</button><div style="min-width:0"><div><span class="en">${esc(i.en)}</span>${i.ipa?`<span class="ipa">${esc(i.ipa)}</span>`:""}</div><div class="vi">${esc(i.vi)}</div></div></div>`).join("")}</div>`:""}</div>`;
}

/* --- Flashcard --- */
let fc=null;
function flashStart(pool){fc={base:pool.slice(),list:pool.slice(),i:0,flip:false,front:fc?fc.front:"en",got:{},miss:{},end:false};fcRender()}
function ipaTag(it){return it.ipa?`<div class="ipa"><span class="uk">UK</span>${esc(it.ipa)}</div>`:""}
function fcRender(){
  if(fc.end)return fcEnd();
  const it=fc.list[fc.i];const known=!!store.known[it.id];
  const en=`<span class="typ pill ${it.type==="w"?"":"grey"}">${esc(posLabel(it))}</span><div class="w">${esc(it.en)}</div>${ipaTag(it)}`;
  const vi=`<div class="w">${esc(it.vi)}</div>`;
  const front=fc.front==="en"?en:vi;
  const back=fc.front==="en"?vi+`<div class="sub-en">${esc(it.en)}</div>${ipaTag(it)}`:en+`<div class="vi-sm">${esc(it.vi)}</div>`;
  const nGot=Object.keys(fc.got).length,nMiss=Object.keys(fc.miss).length;
  const state=fc.got[it.id]?'<span class="pill">Đã thuộc</span>':fc.miss[it.id]?'<span class="pill bad">Chưa thuộc</span>':(known?'<span class="pill">Đã thuộc từ trước</span>':'');
  app.innerHTML=`<div class="stage">
  <div class="progress"><span>${fc.i+1}/${fc.list.length}</span><div class="bar"><i style="width:${(fc.i+1)/fc.list.length*100}%"></i></div><span class="good-t">Thuộc ${nGot}</span><span class="bad-t">Chưa ${nMiss}</span></div>
  <div class="row" style="justify-content:space-between">
    <div class="seg"><button data-act="front-en" aria-pressed="${fc.front==="en"}">Mặt trước: Anh</button><button data-act="front-vi" aria-pressed="${fc.front==="vi"}">Mặt trước: Việt</button></div>
    <div class="row"><button class="btn" data-act="fc-shuffle">Xáo thẻ</button></div>
  </div>
  <button class="fc ${fc.flip?"flip":""}" data-act="flip" aria-label="Lật thẻ"><div class="fc-in">
    <div class="face"><span class="st">${state}</span>${front}<span class="tap">Chạm để lật thẻ</span></div>
    <div class="face back"><span class="st">${state}</span>${back}</div></div></button>
  <div id="fcnote">${noteHTML(it,fc.flip)}</div>
  <div class="judge">
    <button class="btn miss" data-act="fc-miss">✗ Chưa thuộc</button>
    <button class="spk" data-say="${esc(it.en)}" aria-label="Nghe phát âm" style="width:46px;height:46px">${SPK}</button>
    <button class="btn primary" data-act="fc-got">✓ Đã thuộc</button>
  </div>
  <div class="row" style="justify-content:center">
    <button class="btn" data-act="fc-prev" ${fc.i===0?"disabled":""}>← Thẻ trước</button>
    <button class="btn" data-act="fc-next">${fc.i===fc.list.length-1?"Kết thúc":"Bỏ qua →"}</button>
  </div>
  <p class="kbd" style="text-align:center">Phím tắt: Space lật thẻ · S nghe · K đã thuộc · J chưa thuộc · ← → chuyển thẻ</p></div>`;
  if(fc.front==="en"&&!fc.flip) speak(it.en);
}
function fcMark(got){
  const it=fc.list[fc.i];
  if(got){fc.got[it.id]=1;delete fc.miss[it.id];store.known[it.id]=true}
  else{fc.miss[it.id]=1;delete fc.got[it.id];delete store.known[it.id]}
  save();fcMove(1);
}
function fcMove(d){
  const n=fc.i+d;
  if(n<0)return;
  if(n>=fc.list.length){fc.end=true;fcRender();return}
  fc.i=n;fc.flip=false;fcRender();
}
function fcEnd(){
  stopSpeak();
  const missItems=fc.list.filter(i=>fc.miss[i.id]);
  const skipped=fc.list.filter(i=>!fc.miss[i.id]&&!fc.got[i.id]);
  const notKnown=fc.base.filter(i=>!store.known[i.id]);
  const nGot=fc.list.filter(i=>fc.got[i.id]).length;
  app.innerHTML=`<div class="stage"><div class="q"><span class="label">Hết lượt flashcard</span>
  <div class="row" style="justify-content:center;gap:28px">
    <div><div class="score">${nGot}</div><div class="muted">đã thuộc</div></div>
    <div><div class="score" style="color:var(--bad)">${missItems.length}</div><div class="muted">chưa thuộc</div></div>
    ${skipped.length?`<div><div class="score" style="color:var(--muted)">${skipped.length}</div><div class="muted">bỏ qua</div></div>`:""}
  </div>
  <p class="muted" style="margin:0">${notKnown.length?`Cả nhóm còn ${notKnown.length}/${fc.base.length} mục chưa thuộc.`:"Bạn đã thuộc hết cả nhóm này!"}</p>
  <div class="row" style="justify-content:center">
    ${notKnown.length?`<button class="btn primary" data-act="fc-learn-unknown">Chỉ học lại ${notKnown.length} mục chưa thuộc</button>`:""}
    <button class="btn ${notKnown.length?"":"primary"}" data-act="fc-restart">Học lại từ đầu cả nhóm</button>
    <button class="btn" data-go="topic">Chọn cách ôn khác</button>
  </div></div>
  ${notKnown.length?`<h3>Các mục chưa thuộc</h3><div class="vlist">${notKnown.map(i=>`<div class="vrow"><button class="spk" data-say="${esc(i.en)}" aria-label="Nghe">${SPK}</button><div style="min-width:0"><div><span class="en">${esc(i.en)}</span><span class="ipa">${esc(i.ipa)}</span></div><div class="vi">${esc(i.vi)}</div></div></div>`).join("")}</div>`:""}</div>`;
}

/* --- Ghép cặp --- */
let mt=null;
function matchStart(pool){
  const pick=shuffle(pool).slice(0,Math.min(6,pool.length));
  const tiles=shuffle([...pick.map(p=>({p,side:"en"})),...pick.map(p=>({p,side:"vi"}))]);
  mt={pool,tiles,sel:null,left:pick.length,miss:0,start:Date.now(),timer:null};
  app.innerHTML=`<div class="stage"><div class="progress"><span id="mtime">0 giây</span><div class="bar"><i id="mbar" style="width:0%"></i></div><span id="mmiss">Sai 0</span></div>
  <p class="muted" style="margin:0">Chọn một từ tiếng Anh rồi chọn nghĩa tiếng Việt tương ứng.</p>
  <div class="mgrid">${tiles.map((t,k)=>`<button class="tile ${t.side}" data-tile="${k}">${esc(t.p[t.side])}</button>`).join("")}</div>
  <div id="fb"></div></div>`;
  mt.timer=setInterval(()=>{const e=$("#mtime");if(!e){clearInterval(mt.timer);return}e.textContent=Math.round((Date.now()-mt.start)/1000)+" giây"},500);
}
function matchTap(k){
  const t=mt.tiles[k];const el=document.querySelector(`[data-tile="${k}"]`);
  if(t.side==="en")speak(t.p.en);
  if(mt.sel==null){mt.sel=k;el.classList.add("sel");return}
  const s=mt.tiles[mt.sel];const sEl=document.querySelector(`[data-tile="${mt.sel}"]`);
  if(mt.sel===k){el.classList.remove("sel");mt.sel=null;return}
  if(s.side===t.side){sEl.classList.remove("sel");mt.sel=k;el.classList.add("sel");return}
  if(s.p===t.p){
    sEl.classList.add("done");el.classList.add("done");mt.left--;mt.sel=null;
    const tot=mt.tiles.length/2;$("#mbar").style.width=((tot-mt.left)/tot*100)+"%";
    if(!mt.left){
      clearInterval(mt.timer);const sec=Math.round((Date.now()-mt.start)/1000);
      const rec=saveBest("match",sec,true);
      $("#fb").innerHTML=`<div class="q"><span class="label">Hoàn thành</span><div class="score">${sec}s</div><p style="margin:0">Sai ${mt.miss} lần${rec?" · <b style=\"color:var(--accent)\">Kỷ lục mới!</b>":""}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="match-again">Ván mới</button><button class="btn" data-go="topic">Chọn cách ôn khác</button></div></div>`;
    }
  }else{
    mt.miss++;$("#mmiss").textContent="Sai "+mt.miss;
    sEl.classList.remove("sel");sEl.classList.add("bad");el.classList.add("bad");mt.sel=null;
    setTimeout(()=>{sEl.classList.remove("bad");el.classList.remove("bad")},450);
  }
}

/* --- Sắp xếp cụm từ --- */
let sc=null;
function scrStart(pool){
  sc={queue:shuffle(pool).slice(0,Math.min(10,pool.length)),i:0,correct:0,wrong:[]};scrNew();
}
function scrNew(){
  const q=sc.queue[sc.i];const words=q.en.split(" ");
  let order=shuffle(words.map((w,k)=>k));
  if(words.length>2){let n=0;while(order.every((v,k)=>v===k)&&n++<10)order=shuffle(order)}
  sc.tokens=order.map(k=>words[k]);sc.picked=[];sc.answered=false;scrRender();
}
function scrRender(){
  const q=sc.queue[sc.i];
  app.innerHTML=`<div class="stage">${header(sc.i,sc.queue.length,`<span>Đúng ${sc.correct}</span>`)}
  <div class="q"><span class="label">Xếp thành cụm có nghĩa</span><div class="big">${esc(q.vi)}</div></div>
  <div class="slots" id="slots">${sc.picked.length?sc.picked.map((k,j)=>`<button class="chip" data-unpick="${j}">${esc(sc.tokens[k])}</button>`).join(""):'<span class="muted" style="font-size:13px;padding:4px">Chạm vào các từ bên dưới theo đúng thứ tự</span>'}</div>
  <div class="chips">${sc.tokens.map((w,k)=>sc.picked.includes(k)?"":`<button class="chip" data-pick="${k}">${esc(w)}</button>`).join("")}</div>
  <div class="row"><button class="btn primary" data-act="scr-check" ${sc.picked.length!==sc.tokens.length?"disabled":""}>Kiểm tra</button><button class="btn" data-act="scr-clear">Xếp lại</button></div>
  <div id="fb"></div></div>`;
}
function scrCheck(){
  const q=sc.queue[sc.i];const ans=sc.picked.map(k=>sc.tokens[k]).join(" ");
  const ok=ans===q.en;sc.answered=true;
  if(ok)sc.correct++;else sc.wrong.push(q);
  $("#slots").classList.add(ok?"right":"wrong");
  document.querySelectorAll("[data-unpick],[data-act='scr-check'],[data-act='scr-clear']").forEach(b=>b.disabled=true);
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"Chính xác!":"Đáp án:"} <b>${esc(q.en)}</b><button class="spk" data-say="${esc(q.en)}" aria-label="Nghe">${SPK}</button><span style="flex:1"></span><button class="btn primary" data-act="scr-next">Câu tiếp</button></div>${noteHTML(q)}`;
  speak(q.en);
}
function scrNext(){
  sc.i++;
  if(sc.i<sc.queue.length)return scrNew();
  sess={mode:"scramble",queue:sc.queue,correct:sc.correct,wrong:sc.wrong};result();
}

/* ===================== BỘ HỌC CỦA BẠN (tự tạo) ===================== */
/* Lưu trong localStorage riêng: {v:1, sets:[{id,name,sub,created,items:[{en,ipa,vi,pos,ex,exVi,syn,note}]}]} */
const MY_KEY="toeic-my-sets-v1";
let mySets=(()=>{try{const r=JSON.parse(localStorage.getItem(MY_KEY));return r&&Array.isArray(r.sets)?r.sets:[]}catch(e){return []}})();
const MY_DATA=[],MY_ITEMS=[];
function mySave(){try{localStorage.setItem(MY_KEY,JSON.stringify({v:1,sets:mySets}));return true}catch(e){toast("Không lưu được vào trình duyệt (bộ nhớ đầy hoặc bị chặn).");return false}}
function guessType(r){const p=r.pos||"";if(/cụm|thành ngữ/.test(p))return "p";if(p)return "w";return /\s/.test(String(r.en).trim())?"p":"w"}
function myBuild(){
  MY_DATA.length=0;MY_ITEMS.length=0;
  mySets.forEach(s=>{
    const t={id:s.id,section:"my",custom:true,name:s.name,sub:s.sub||"Bộ học bạn tự tạo",eyebrow:"Bộ học của bạn",words:[],phrases:[],items:[]};
    const seen=new Set();
    (s.items||[]).forEach(r=>{
      if(!r||!r.en||!r.vi||seen.has(r.en))return;seen.add(r.en);
      const it={en:r.en,ipa:r.ipa||"",vi:r.vi,pos:r.pos||"",ex:r.ex||"",exVi:r.exVi||"",syn:r.syn||"",note:r.note||"",id:s.id+":"+r.en,topic:s.id,custom:true};
      it.type=guessType(it);
      t.items.push(it);(it.type==="p"?t.phrases:t.words).push(it);MY_ITEMS.push(it);
    });
    MY_DATA.push(t);
  });
}
myBuild();
/* Sắp xếp cụm từ cho bộ tự tạo: dùng cụm từ + câu ví dụ */
function myScramblePool(t){

}
function posLabel(it){if(it.pos)return it.pos.charAt(0).toUpperCase()+it.pos.slice(1);return it.type==="w"?"Từ":"Cụm từ"}
function synList(s){return String(s||"").split(/\s*[,;\/]\s*/).map(x=>x.trim()).filter(Boolean)}

const VN_RE=/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;

const POS_DEF=[
 ["cụm động từ",["phrasal verb","phr v","phrv","cụm động từ","cđt"]],

 ["danh từ",["n","noun","nouns","danh từ","dt","countable noun","uncountable noun","n c","n u"]],
 ["động từ",["v","verb","verbs","động từ","đgt","vt","vi"]],
 ["tính từ",["adj","a","adjective","adjectives","tính từ","tt"]],

const POS_OPTS=POS_DEF.map(x=>x[0]);

const EN_POS={noun:"danh từ",verb:"động từ",adjective:"tính từ",adverb:"trạng từ",preposition:"giới từ",conjunction:"liên từ",pronoun:"đại từ"};
function posKey(s){return String(s).toLowerCase().replace(/[.()\[\]{}]/g," ").replace(/\s+/g," ").trim()}
function posOf(s){

  if(parts.length>1&&parts.every(p=>POS_LOOK[p]))return [...new Set(parts.map(p=>POS_LOOK[p]))].join(", ");

const LABELS=[

function labelOf(s){const k=String(s).toLowerCase().replace(/\.$/,"").replace(/\s+/g," ").trim();for(const [f,re] of LABELS)if(re.test(k))return f;return null}
const LBL_ALT="nghĩa câu ví dụ|nghĩa ví dụ|dịch ví dụ|nghĩa vd|câu ví dụ|ví dụ|vd|v\\.d|examples?|ex|e\\.g|từ đồng nghĩa|đồng nghĩa|synonyms?|syn|gần nghĩa|từ trái nghĩa|trái nghĩa|antonyms?|ghi chú|lưu ý|mẹo nhớ|mẹo|cách dùng|cụm đi kèm|collocations?|dịch nghĩa|nghĩa tiếng việt|nghĩa|meaning|phiên âm|ipa|phát âm|pronunciation|loại từ|từ loại";

function normIpa(s){

function cleanSec(s){s=String(s||"").replace(/\s+/g," ").trim().replace(/^[\s;,|:：–—-]+|[\s;,|–—-]+$/g,"");

  if(f==="ipa"){if(!r.ipa)r.ipa=normIpa(v);return}
  if(f==="pos"){if(!r.pos)r.pos=posOf(v)||v.toLowerCase();return}

function mergeInto(r,e){for(const k in e){if(e[k]&&!r[k])r[k]=e[k]}return r}
function splitLabels(text){

function cleanEn(s){
  return String(s||"").replace(/[*_`"“”]/g,"").replace(/^[\s'‘’.,;:–—-]+|[\s.,;:–—-]+$/g,"").replace(/^[‘']|[’']$/g,"").replace(/\s+/g," ").trim();
}
function validEn(en){

function parseHead(h,r){

function parseEntry(text){
  const r=blankRow();
  const {head,secs}=splitLabels(String(text));
  parseHead(head,r);
  secs.forEach(([f,v])=>applySec(r,f,v));
  return r;
}
function finishRow(r){
  r.en=cleanEn(r.en);
  ["pos","vi","ex","exVi","syn","note"].forEach(k=>r[k]=cleanSec(r[k]));
  r.ipa=normIpa(r.ipa);r.vi=r.vi.replace(/\s*[.。]+$/,"");
  if(r.pos)r.pos=posOf(r.pos)||r.pos;
  if(!validEn(r.en))return null;

}
function cleanLine(l){
  return String(l).replace(/ /g," ").replace(/\*\*|__/g,"").trim()
    .replace(/^(?:[-•*+●▪◦○■□➢➤►✓✔]|\d{1,3}\s*[.)\]:]|\(\d{1,3}\)|[a-z][.)](?=\s))\s*/i,"").trim();
}
function isSentence(l){return !VN_RE.test(l)&&l.split(/\s+/).length>=3&&/[.?!]["”’']?$/.test(l)}
function parseText(text){
  const lines=String(text).replace(/\r/g,"").split("\n").map(cleanLine).filter(Boolean);
  if(!lines.length)return [];
  const tabbed=lines.filter(l=>l.includes("\t")).length;
  if(tabbed>=Math.max(2,lines.length*.5))return parseTable(lines.map(l=>l.split("\t")));
  const piped=lines.filter(l=>(l.match(/\|/g)||[]).length>=2).length;
  if(piped>=Math.max(2,lines.length*.6))return parseTable(lines.filter(l=>!/^\|?\s*:?-{3,}/.test(l)).map(l=>l.replace(/^\||\|$/g,"").split("|")));
  const rows=[];let prev=null;
  const push=r=>{const f=finishRow(r);if(f){rows.push(f);prev=f}};
  for(const l of lines){
    if(LINE_EN_RE.test(l)){push(parseEntry(l.replace(LINE_EN_RE,"")));continue}
    const {head,secs}=splitLabels(l);
    if(!cleanSec(head)&&secs.length){
      if(prev)secs.forEach(([f,v])=>applySec(prev,f,v));
      else{const r=blankRow();secs.forEach(([f,v])=>applySec(r,f,v));if(r.en)push(r)}
      continue;
    }
    if(prev&&isSentence(l)&&!/\s[-–—]\s|[–—→]|=>/.test(l)){applySec(prev,"ex",l);continue}
    const tk=l.split(/\s+/);
    const vnStart=VN_RE.test(tk[0])||(VN_PLAIN.has(tk[0].toLowerCase())&&tk[1]&&VN_RE.test(tk[1])&&(tk.length>=5||/[.?!]$/.test(l)));
    if(prev&&vnStart){
      if(/\t|\s[-–—=]\s|[–—:：|→]|=>/.test(l)){const r=parseEntry(l);if(r.en&&validEn(cleanEn(r.en))&&r.vi){push(r);continue}}

function headLabel(c){
  const k=String(c||"").toLowerCase().replace(/[*:_.]/g," ").replace(/\s+/g," ").trim();if(!k||k.length>40)return null;
  if(/(nghĩa|dịch).*(ví dụ|vd|câu)|(ví dụ|example).*(nghĩa|dịch|translation|meaning)|translation/.test(k))return "exVi";
  if(/đồng nghĩa|synonym|^syn|gần nghĩa/.test(k))return "syn";
  if(/trái nghĩa|antonym/.test(k))return "ant";
  if(/ghi chú|lưu ý|^notes?$|mẹo|cách dùng|collocation/.test(k))return "note";
  if(/phiên âm|^ipa|phát âm|pronunciation|phonetic/.test(k))return "ipa";
  if(/loại từ|từ loại|part of speech|^pos$|^type$|word class|^loại$/.test(k))return "pos";
  if(/ví dụ|example|^vd$|sentence|^câu/.test(k))return "ex";
  if(/nghĩa|meaning|tiếng việt|vietnamese|^vi$|definition|^dịch/.test(k))return "vi";
  if(/^(từ|từ vựng|từ mới|từ ?\/ ?cụm từ|cụm từ|word|words|vocabulary|vocab|term|english|tiếng anh|en|new words?)$/.test(k))return "en";

  const m={},used=new Set();let key=false;
  cells.forEach((c,j)=>{const f=headLabel(c);if(f&&!used.has(f)){m[j]=f;used.add(f);if(f==="en"||f==="vi")key=true}});

}
function classifyCell(c,r){
  if(/^[\/\[].*[\/\]]$/.test(c)&&(IPA_CH.test(c)||!VN_RE.test(c)))return "ipa";
  if(posOf(c))return "pos";
  if(/^=/.test(c))return "syn";
  const vn=VN_RE.test(c),w=c.split(/\s+/).length;

function parseTable(table){
  table=table.map(r=>(Array.isArray(r)?r:[r]).map(c=>String(c==null?"":c).replace(/\s+/g," ").trim())).filter(r=>r.some(Boolean));
  if(!table.length)return [];
  let map=null,start=0;
  for(let i=0;i<Math.min(3,table.length);i++){const m=headerMap(table[i]);if(m){map=m;start=i+1;break}}

      cells.forEach((c,j)=>{const f=map[j];if(!f||!c)return;if(f==="en")mergeInto(r,parseEntry(c));else applySec(r,f,c)});
    }else{
      let first=true;

function parseCSV(text,delim){
  text=String(text).replace(/^﻿/,"");
  if(!delim){const l=text.split("\n")[0]||"";const c=d=>l.split(d).length;delim=[",",";","\t"].sort((a,b)=>c(b)-c(a))[0]}
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch;continue}
    if(ch==='"'&&cell.trim()===""){q=true;cell="";continue}
    if(ch===delim){row.push(cell);cell="";continue}
    if(ch==="\n"){row.push(cell);rows.push(row);row=[];cell="";continue}
    if(ch!=="\r")cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}

}
function parseHtml(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  /* Đọc theo đúng thứ tự trong file: đoạn văn và bảng xen kẽ */
  let rows=[],lines=[];
  const flush=()=>{if(lines.length){rows=rows.concat(parseText(lines.join("\n")));lines=[]}};
  const walk=el=>{[...el.children].forEach(c=>{
    if(c.tagName==="TABLE"){flush();rows=rows.concat(parseTable([...c.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>{td.querySelectorAll("br").forEach(b=>b.replaceWith(" "));td.querySelectorAll("p,li").forEach(p=>p.append(" "));return td.textContent}))))}
    else if(/^(P|LI|H[1-6])$/.test(c.tagName)){c.querySelectorAll("br").forEach(b=>b.replaceWith("\n"));lines.push(c.textContent)}
    else walk(c);
  })};
  walk(doc.body);flush();

}
function parseJSON(text){
  let j;try{j=JSON.parse(text)}catch(e){throw new Error("File JSON bị lỗi định dạng.")}
  if(j&&j.type==="so-tu-toeic-backup")throw new Error("Đây là file sao lưu. Hãy dùng nút “Khôi phục từ bản sao lưu” ở trang Bộ học của bạn.");
  const arr=Array.isArray(j)?j:(j&&(j.items||j.words))||[];
  if(arr.length&&Array.isArray(arr[0]))return parseTable(arr);
  const out=[];
  arr.forEach(o=>{if(!o||typeof o!=="object")return;const r=blankRow();Object.keys(o).forEach(k=>{const f=headLabel(k)||(k in r?k:null);if(f)applySec(r,f,String(o[k]))});const f=finishRow(r);if(f)out.push(f)});

}
let LOCAL=null;
function localFill(r){
  if(!LOCAL){LOCAL={};[...ITEMS,...NW_ITEMS,...MY_ITEMS].forEach(i=>{const k=i.en.toLowerCase();if(!LOCAL[k])LOCAL[k]=i})}
  const k=r.en.toLowerCase(),i=LOCAL[k];
  if(!r.ipa)r.ipa=(i&&i.ipa)||VOC[k]||"";
  if(!r.vi&&i)r.vi=i.vi;

}
function mergeRows(base,add){
  const idx={};base.forEach(r=>idx[r.en.toLowerCase()]=r);
  let added=0,merged=0;
  add.forEach(r=>{localFill(r);const k=r.en.toLowerCase();if(idx[k]){mergeInto(idx[k],r);merged++}else{base.push(r);idx[k]=r;added++}});
  return {added,merged};
}

const LIBS={};
function loadLib(src,g){
  if(window[g])return Promise.resolve(window[g]);
  return LIBS[src]||(LIBS[src]=new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;
    s.onload=()=>window[g]?ok(window[g]):no(new Error("Không tải được bộ đọc file."));
    s.onerror=()=>{delete LIBS[src];no(new Error("Không tải được bộ đọc file. Kiểm tra kết nối mạng rồi thử lại."))};document.head.appendChild(s)}));
}
async function readText(f){
  const buf=await f.arrayBuffer();
  let t=new TextDecoder("utf-8").decode(buf);
  if(t.includes("�")){try{t=new TextDecoder("windows-1258").decode(buf)}catch(e){}}
  return t;
}
async function readFileRows(f){
  const ext=(f.name.toLowerCase().match(/\.([a-z0-9]+)$/)||[])[1]||"txt";
  if(ext==="docx"){const m=await loadLib("lib/mammoth.browser.min.js","mammoth");const res=await m.convertToHtml({arrayBuffer:await f.arrayBuffer()});return parseHtml(res.value)}
  if(["xlsx","xls","xlsm","ods"].includes(ext)){const X=await loadLib("lib/xlsx.full.min.js","XLSX");const wb=X.read(new Uint8Array(await f.arrayBuffer()),{type:"array"});let rows=[];wb.SheetNames.forEach(n=>{rows=rows.concat(parseTable(X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""})))});return rows}
  if(ext==="doc")throw new Error("File Word cũ (.doc) chưa đọc được. Mở file bằng Word, chọn Lưu thành (Save As) dạng .docx rồi tải lại.");
  if(ext==="pdf")throw new Error("Chưa đọc được PDF. Hãy chép nội dung sang file Word (.docx) hoặc .txt.");
  if(["png","jpg","jpeg","gif","webp","heic"].includes(ext))throw new Error("Chưa đọc được ảnh. Hãy dùng file Word, Excel, CSV hoặc TXT.");
  const text=await readText(f);
  if(ext==="json")return parseJSON(text);
  if(ext==="csv"||ext==="tsv")return parseTable(parseCSV(text,ext==="tsv"?"\t":null));
  return parseText(text);
}

/* ---------- Tự bổ sung phần còn thiếu (cần mạng) ---------- */
async function fetchJSON(url,ms){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||9000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)return {miss:true};return await r.json()}catch(e){return null}finally{clearTimeout(t)}
}
async function dictLookup(en){
  const w=en.toLowerCase().replace(/^be\s+/,"").trim();
  const j=await fetchJSON("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));
  if(j===null)return null;
  if(!Array.isArray(j))return {};
  const o={};const ph=[];
  j.forEach(e=>{(e.phonetics||[]).forEach(p=>p.text&&ph.push(p));if(e.phonetic)ph.push({text:e.phonetic,audio:""})});
  const uk=ph.find(p=>/-uk\.mp3/.test(p.audio||""))||ph.find(p=>!/-us\.mp3/.test(p.audio||""))||ph[0];
  if(uk)o.ipa=normIpa(uk.text.replace(/\./g,""));
  const m=(j[0].meanings||[])[0];if(m&&EN_POS[m.partOfSpeech])o.pos=EN_POS[m.partOfSpeech];
  const syn=[];let ex="";
  j.forEach(e=>(e.meanings||[]).forEach(mm=>{(mm.synonyms||[]).forEach(s=>syn.push(s));(mm.definitions||[]).forEach(d=>{(d.synonyms||[]).forEach(s=>syn.push(s));if(!ex&&d.example&&d.example.split(" ").length>=4)ex=d.example})}));
  if(syn.length)o.syn=[...new Set(syn)].filter(s=>s.toLowerCase()!==w).slice(0,4).join(", ");
  if(ex)o.ex=ex.charAt(0).toUpperCase()+ex.slice(1)+(/[.?!]$/.test(ex)?"":".");
  return o;
}
async function translate(text){
  const j=await fetchJSON("https://api.mymemory.translated.net/get?langpair=en|vi&q="+encodeURIComponent(text.slice(0,450)));
  if(!j||j.miss)return j;
  const t=j.responseData&&j.responseData.translatedText;
  if(!t||+j.responseStatus!==200||/MYMEMORY|QUERY LENGTH/i.test(t)||t.trim().toLowerCase()===text.trim().toLowerCase())return {};
  return {text:t.trim()};
}

function draftFiles(files){
  files=[...(files||[])];if(!files.length)return;
  dmsg("info","Đang đọc "+files.length+" file…");

    const notes=[];let total=0;
    for(const f of files){
      try{
        const rows=await readFileRows(f);
        const {added,merged}=mergeRows(draft.rows,rows);total+=added;
        notes.push(rows.length?`<b>${esc(f.name)}</b>: đọc được ${rows.length} mục${merged?` (${merged} mục trùng đã gộp)`:""}.`:`<b>${esc(f.name)}</b>: không tìm thấy từ nào. Xem phần “File nên trình bày thế nào” bên dưới.`);
        if(!draft.name)draft.name=f.name.replace(/\.[^.]+$/,"").replace(/[_]+/g," ").trim();
      }catch(e){notes.push(`<b>${esc(f.name)}</b>: ${esc(e.message||"không đọc được file.")}`)}
    }
    if(S.view!=="create")return;
    const nm=$("#d-name");if(nm&&!nm.value)nm.value=draft.name;
    const miss=draft.rows.filter(r=>!r.vi).length;
    renderRows();
    dmsg(total?"ok":"err",notes.join("<br>")+(miss?`<br>Còn ${miss} mục chưa có nghĩa: bấm “Tự bổ sung phần còn thiếu” hoặc tự điền.`:"")+(total?"<br>Kiểm tra lại danh sách bên dưới rồi bấm <b>Tạo bộ học</b>.":""));
  })();
}
function draftAddManual(form){

async function draftEnrich(){
  const need=r=>!r.vi||!r.ipa||!r.pos||!r.ex||!r.syn||(r.ex&&!r.exVi);
  const work=draft.rows.filter(need);
  if(!work.length){dmsg("ok","Tất cả các mục đã đủ thông tin.");return}
  if(navigator.onLine===false){dmsg("err","Máy đang mất mạng nên chưa tra cứu được. Bạn vẫn có thể tự điền vào các ô trống.");return}
  draft.busy=true;const b=$("#d-enrich");if(b)b.disabled=true;
  let done=0,ok=0,offline=0;
  const one=async r=>{
    const got=[];
    if(!r.ipa||!r.pos||!r.ex||!r.syn){
      const d=await dictLookup(r.en);
      if(d===null)offline++;
      else{["ipa","pos","ex","syn"].forEach(k=>{if(!r[k]&&d[k]){r[k]=d[k];got.push(k)}});
        if(!r.pos&&!d.pos&&/\s/.test(r.en)){r.pos="cụm từ";got.push("pos")}}
    }
    if(!r.vi){const t=await translate(r.en);if(t&&t.text){r.vi=t.text;got.push("vi")}else if(t===null)offline++}
    if(r.ex&&!r.exVi){const t=await translate(r.ex);if(t&&t.text){r.exVi=t.text;got.push("exVi")}}
    if(got.length){r.auto=[...new Set([...(r.auto||[]),...got])];ok++}
    done++;if(S.view==="create")dmsg("info",`Đang tra cứu… ${done}/${work.length}`);
  };
  let k=0;
  await Promise.all([0,1,2].map(async()=>{while(k<work.length){await one(work[k++])}}));
  draft.busy=false;
  if(S.view!=="create")return;
  renderRows();
  const left=draft.rows.filter(need).length,miss=draft.rows.filter(r=>!r.vi).length;
  if(!ok&&offline)dmsg("err","Không kết nối được tới từ điển trực tuyến (mạng yếu hoặc bị chặn). Bạn có thể thử lại sau, hoặc tự điền vào các ô trống.");
  else dmsg(ok?"ok":"info",`Đã bổ sung thông tin cho ${ok}/${work.length} mục (nhãn vàng “Tự bổ sung”: nên xem lại nghĩa cho đúng ngữ cảnh TOEIC).`+(left?` ${left} mục vẫn còn thiếu vài phần, thường là cụm từ hiếm – không bắt buộc phải có.`:"")+(miss?` <b>${miss} mục chưa có nghĩa</b>, hãy tự điền.`:""));
}
function draftSave(){
  const rows=draft.rows.filter(r=>r.en.trim());
  if(!rows.length){dmsg("err","Danh sách đang trống. Hãy tải file hoặc nhập ít nhất 1 từ.");return}
  const miss=rows.filter(r=>!r.vi.trim());
  if(miss.length){
    renderRows();dmsg("err",`Còn <b>${miss.length} mục chưa có nghĩa tiếng Việt</b> (viền đỏ, đã mở sẵn). Hãy điền nghĩa, bấm “Tự bổ sung phần còn thiếu”, hoặc xóa các mục đó.`);
    const e=document.querySelector(".drow.miss");if(e)e.scrollIntoView({block:"center",behavior:"smooth"});return;
  }
  const name=(draft.name||"").trim()||("Bộ học ngày "+new Date().toLocaleDateString("vi-VN"));
  const seen=new Set(),items=[];
  rows.forEach(r=>{const en=cleanEn(r.en);if(!en||seen.has(en))return;seen.add(en);
    items.push({en,ipa:normIpa(r.ipa),vi:r.vi.trim(),pos:(r.pos||"").trim(),ex:(r.ex||"").trim(),exVi:(r.exVi||"").trim(),syn:synList(r.syn).join(", "),note:(r.note||"").trim()})});
  const ed=!!draft.editId;
  let set=ed&&mySets.find(s=>s.id===draft.editId);
  if(set){set.name=name;set.sub=(draft.sub||"").trim();set.items=items;set.updated=Date.now()}
  else{set={id:"my-"+Date.now().toString(36),name,sub:(draft.sub||"").trim(),created:Date.now(),items};mySets.unshift(set)}
  if(!mySave())return;
  myBuild();LOCAL=null;draft=null;
  go("topic",{topic:set.id});
  toast(ed?"Đã lưu thay đổi.":`Đã tạo bộ học ${items.length} mục. Chọn cách ôn bên dưới!`);
}

async function myImport(f){

    mySave();myBuild();LOCAL=null;renderMySets();toast(`Đã khôi phục ${n} bộ học.`);
  }catch(e){toast("File này không phải bản sao lưu của Sổ từ TOEIC.")}
}

  loadLib("lib/xlsx.full.min.js","XLSX").then(X=>{
    const ws=X.utils.aoa_to_sheet(parseCSV(SAMPLE_CSV));ws["!cols"]=[{wch:16},{wch:10},{wch:16},{wch:24},{wch:44},{wch:44},{wch:22}];
    const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,"Tu vung");X.writeFile(wb,"mau-bo-hoc.xlsx");
  }).catch(e=>toast(e.message));
}

/* ===================== SỰ KIỆN ===================== */
window.__toeicClick=(e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.say){e.stopPropagation();speak(d.say);if(!d.act)return}
  if(d.go){go(d.go);return}
  if(d.topic){go("topic",{topic:d.topic});return}
  if(d.mode){go("mode",{mode:d.mode});return}
  if(d.filter){store.filter=d.filter;save();renderTopic();return}
  if(d.act&&/^(my|d)-/.test(d.act)){myAct(d,b);return}
  if(d.opt!=null){mcqAnswer(+d.opt);return}
  if(d.tile!=null){matchTap(+d.tile);return}
  if(d.pick!=null){sc.picked.push(+d.pick);scrRender();return}
  if(d.unpick!=null){sc.picked.splice(+d.unpick,1);scrRender();return}
  switch(d.act){
    case "next":next();break;
    case "check":inpCheck(false);break;
    case "skip":inpCheck(true);break;
    case "hint":{const h=$("#hint");if(h)h.hidden=false;$("#ans").focus();break}
    case "again":startMode(sess.mode);break;
    case "retrywrong":{const m=sess.mode,w=sess.wrong.slice();m==="scramble"?scrStart(w):startMode(m,w);break}
    case "flip":{fc.flip=!fc.flip;document.querySelector(".fc").classList.toggle("flip",fc.flip);const nt=document.querySelector("#fcnote .note");if(nt)nt.hidden=!fc.flip;if(fc.flip&&fc.front==="vi")speak(fc.list[fc.i].en);break}
    case "fc-prev":fcMove(-1);break;
    case "fc-next":fcMove(1);break;
    case "fc-got":fcMark(true);break;
    case "fc-miss":fcMark(false);break;
    case "fc-shuffle":fc.list=shuffle(fc.list);fc.i=0;fc.flip=false;fcRender();toast("Đã xáo thẻ");break;
    case "fc-restart":{const b=fc.base;flashStart(b);toast("Học lại từ đầu "+b.length+" mục");break}
    case "fc-learn-unknown":{const b=fc.base,u=b.filter(i=>!store.known[i.id]);flashStart(b);fc.list=shuffle(u);fcRender();toast(u.length+" mục chưa thuộc");break}
    case "front-en":fc.front="en";fc.flip=false;fcRender();break;
    case "front-vi":fc.front="vi";fc.flip=false;fcRender();break;
    case "match-again":matchStart(mt.pool);break;
    case "scr-check":scrCheck();break;
    case "scr-clear":sc.picked=[];scrRender();break;
    case "scr-next":scrNext();break;
  }
});
window.__toeicChange=(e=>{if(e.target.id==="slowchk")slow=e.target.checked;
  if(e.target.id==="d-file"){draftFiles(e.target.files);e.target.value="";return}
  if(e.target.id==="my-import"){const f=e.target.files[0];e.target.value="";if(f)myImport(f);return}
  if(draftField(e.target)){const i=+e.target.dataset.r;const row=document.querySelector(`.drow[data-row="${i}"]`);if(row&&draft.rows[i]){row.classList.toggle("miss",!draft.rows[i].vi);row.querySelector("summary").innerHTML=rowSum(draft.rows[i],i);const n=draft.rows.length,miss=draft.rows.filter(r=>!r.vi).length;$("#d-count").textContent=`${n} mục`+(miss?` · ${miss} mục chưa có nghĩa`:"")}return}
  if(e.target.id==="voicesel"){store.voice=e.target.value;save();VOICE=null;pickVoice();lastSay={t:"",at:0};speak("Hello, this is my voice.")}});
window.__toeicSubmit=(e=>{if(e.target.id==="inpform"){e.preventDefault();inpCheck(false)}
  if(e.target.id==="d-form"){e.preventDefault();draftAddManual(e.target)}});
/* Ô nhập của trang tạo bộ học: cập nhật bản nháp ngay khi gõ */
function draftField(el){
  if(!draft||S.view!=="create"||!el.dataset)return false;
  if(el.dataset.d){draft[el.dataset.d]=el.value;return false}
  const f=el.dataset.f,i=el.dataset.r;if(!f||i==null||!draft.rows[+i])return false;
  const r=draft.rows[+i];r[f]=el.value;if(r.auto)r.auto=r.auto.filter(x=>x!==f);return true;
}
window.addEventListener("input",e=>draftField(e.target));
["dragover","dragenter"].forEach(ev=>window.addEventListener(ev,e=>{if(S.view!=="create")return;e.preventDefault();const z=$("#drop");if(z)z.classList.toggle("over",!!e.target.closest&&!!e.target.closest("#drop"))}));
window.addEventListener("dragleave",e=>{const z=$("#drop");if(z&&!e.relatedTarget)z.classList.remove("over")});
window.addEventListener("drop",e=>{if(S.view!=="create")return;e.preventDefault();const z=$("#drop");if(z)z.classList.remove("over");
  if(!draft)return;if(draft.tab!=="file"){draft.tab="file";renderCreate()}if(e.dataTransfer&&e.dataTransfer.files.length)draftFiles(e.dataTransfer.files)});
function myAct(d,b){
  switch(d.act){
    case "my-new":if(!draft||draft.editId||!draft.rows.length){draft=newDraft()}else toast("Đang tiếp tục bản nháp chưa lưu.");go("create");break;
    case "my-edit":myEdit(S.topic);break;
    case "my-del":if(b.dataset.armed){myDelete(S.topic)}else{b.dataset.armed=1;b.textContent="Bấm lần nữa để xóa hẳn";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Xóa bộ học"}},4000)}break;
    case "my-export":myExport();break;
    case "d-tab":draft.tab=d.tab;renderCreate();break;
    case "d-del":{const i=+d.r;const r=draft.rows[i];draft.rows.splice(i,1);renderRows();if(r)toast("Đã xóa “"+r.en+"”");break}
    case "d-clear":if(b.dataset.armed){draft.rows=[];renderRows();dmsg(null)}else{b.dataset.armed=1;b.textContent="Bấm lần nữa để xóa hết"}break;
    case "d-paste":draftPaste();break;
    case "d-enrich":if(!draft.busy)draftEnrich();break;
    case "d-save":draftSave();break;
    case "d-cancel":{const back=draft&&draft.editId;draft=null;back?go("topic",{topic:back}):go("mysets");break}
    case "d-sample":if(d.kind==="xlsx")sampleXlsx();else if(d.kind==="csv")downloadFile("mau-bo-hoc.csv",SAMPLE_CSV,"text/csv;charset=utf-8");else downloadFile("mau-bo-hoc.txt",SAMPLE_TXT,"text/plain;charset=utf-8");break;
  }
}
window.__toeicKey=(e=>{
  if(S.view!=="mode")return;
  const inInput=e.target.tagName==="INPUT";
  if(S.mode==="flash"&&fc&&!inInput){
    if(fc.end)return;
    if(e.key.toLowerCase()==="j"){fcMark(false);return}
    if(e.key===" "){e.preventDefault();document.querySelector('[data-act="flip"]').click()}
    else if(e.key==="ArrowRight")fcMove(1);else if(e.key==="ArrowLeft")fcMove(-1);
    else if(e.key.toLowerCase()==="s")speak(fc.list[fc.i].en);
    else if(e.key.toLowerCase()==="k")fcMark(true);
    return;
  }
  if(["vi2en","en2vi","listen"].includes(S.mode)&&sess&&!inInput){
    if(/^[1-4]$/.test(e.key)&&!sess.answered){const k=+e.key-1;if(sess.opts&&sess.opts[k])mcqAnswer(k)}
    else if(e.key==="Enter"&&sess.answered){e.preventDefault();next()}
  }
  if(S.mode==="scramble"&&sc&&e.key==="Enter"&&!inInput){
    if(sc.answered)scrNext();else if(sc.picked.length===sc.tokens.length)scrCheck();
  }
});
document.onclick=document.onchange=document.onsubmit=document.onkeydown=null;
if(!window.__toeicBound){
  window.__toeicBound=true;
  /* Bắt sự kiện ở tầng ngoài cùng và chặn lan truyền: mỗi thao tác chỉ được xử lý đúng 1 lần */
  [["click","__toeicClick"],["change","__toeicChange"],["submit","__toeicSubmit"],["keydown","__toeicKey"]].forEach(([ev,fn])=>{
    window.addEventListener(ev,e=>{e.stopImmediatePropagation();const f=window[fn];if(f)f(e)},true);
  });
}
render();
</script>
